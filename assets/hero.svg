<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img"
     aria-labelledby="t" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">fastflowlm-tray: one tray dot moving through stopped, loading, ready and generating, each state driven by a FastFlowLM journal marker</title>

  <rect width="1200" height="420" rx="18" fill="#14161a"/>

  <text x="64" y="112" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#eef1f5">fastflowlm-tray</text>
  <text x="64" y="160" font-size="25" fill="#a3acb9">Start, stop and switch FastFlowLM models from the KDE Plasma system tray,</text>
  <text x="64" y="194" font-size="25" fill="#a3acb9">with your AMD Ryzen AI NPU doing the work.</text>

  <line x1="64" y1="238" x2="1136" y2="238" stroke="#262a31" stroke-width="1"/>

  <!-- stopped -->
  <circle cx="198" cy="300" r="24" fill="#888888"/>
  <text x="198" y="358" font-size="24" font-weight="600" fill="#eef1f5" text-anchor="middle">stopped</text>
  <text x="198" y="390" font-size="18" fill="#737d8a" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">inactive</text>

  <!-- loading -->
  <circle cx="466" cy="300" r="24" fill="#d8a03c"/>
  <text x="466" y="358" font-size="24" font-weight="600" fill="#eef1f5" text-anchor="middle">loading</text>
  <text x="466" y="390" font-size="18" fill="#737d8a" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Loading model:</text>

  <!-- ready -->
  <circle cx="734" cy="300" r="24" fill="#3daf3d"/>
  <text x="734" y="358" font-size="24" font-weight="600" fill="#eef1f5" text-anchor="middle">ready</text>
  <text x="734" y="390" font-size="18" fill="#737d8a" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">WebServer started</text>

  <!-- generating: rings stand in for the breathing pulse -->
  <circle cx="1002" cy="300" r="48" fill="none" stroke="#3daf3d" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="1002" cy="300" r="36" fill="none" stroke="#3daf3d" stroke-opacity="0.28" stroke-width="2"/>
  <circle cx="1002" cy="300" r="24" fill="#3daf3d"/>
  <text x="1002" y="358" font-size="24" font-weight="600" fill="#eef1f5" text-anchor="middle">generating</text>
  <text x="1002" y="390" font-size="18" fill="#737d8a" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">NPU Locked</text>
</svg>
